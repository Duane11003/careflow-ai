[project]
name = "backend"
version = "0.1.0"
description = "Simple chatbot with a React frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.13.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
